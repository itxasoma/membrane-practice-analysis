#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# NVT Production — 293.5 K
# Student: sadhbh
# Note: equilibration output lives in Equilibrat_NPT/run_output/

set temperature   293.5

#############################################################
## INPUT FILES                                             ##
#############################################################

coordinates       coordenades_inicials.pdb
structure         estructura_membranaDMPC.psf
set outputname    NVT

set inputname     NPT
binCoordinates    NPT.restart.coor
binVelocities     NPT.restart.vel
extendedSystem    NPT.restart.xsc

paraTypeCharmm    on
parameters        parametres.prm

#############################################################
## SYSTEM SIZE AND BC                                      ##
#############################################################

wrapWater         on
wrapAll           on

#############################################################
## electrostatics and force field parameters               ##
#############################################################

exclude           scaled1-4
1-4scaling        1.0
cutoff            12.
switching         on
switchdist        10.
pairlistdist      13.5

PME               yes
PMEGridSizeX      72
PMEGridSizeY      60
PMEGridSizeZ      72

#############################################################
## INTEGRATION ALGORITHMS AND THERMODYNAMIC ENSEMBLE       ##
#############################################################

timestep            2.0
rigidBonds          all
nonbondedFreq       1
fullElectFrequency  2
stepspercycle       10

temperature         $temperature

langevin            on
langevinDamping     1
langevinTemp        $temperature
langevinHydrogen    off

#############################################################
## OUTPUT                                                  ##
#############################################################

outputName          $outputname

restartfreq         5000     ;# 5000 steps = every 10ps
dcdfreq             10       ;# 10 steps = every 20fs
xstFreq             5000
outputEnergies      1000
outputPressure      1000

#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

numsteps 50000
